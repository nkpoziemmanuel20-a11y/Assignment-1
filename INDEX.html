<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kpozyke</title>
    <style>
        .containter{
            background-color: bisque;
            height: 100vh;
           display: flex;
           justify-content: center;
           align-items: center;
        }
     .calBox{
        border: 2px solid #16131371;

        }
        .display{
            height: 150px;
            width: 320px;
            background: #831717;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .inputBox{
           background: #07b3aa;
            width: 90%;
            height: 80%;
            border-radius: 20px;

        }
        .input{
            height: 100%;
            width: 100%;
            background-color: transparent;
            outline: none;
            font-size: 50px;
             border-radius: 20px;
        }
        /* CAL BUTTON COLLECTION*/
        .calBnt{
         display: flex;
         justify-content: center;
         
        }

        .btns{
            width:100%;
            height: 100%;
            display: flex;
            flex-direction: column;
           


        }
        .bnt{
            width:25%;
            height:100px;
            font-size: 30px;
            border: 3px inset #9b1717bb;
            background: #11996cc0;
            
        }

    </style>
   
</head>
<body>
    <div class="containter">
        <div class="calBox"  >
            <div class="display">
<div class="inputBox">
        <input class="input" type="text" name="" id="display">
</div>
            </div>
            <div class="calBnt">
               <div class="btns">
                <div class="bntRow">
                    <button class="bnt" id="minus">-</button><button class="bnt" id="plus">+</button><button class="bnt" id="mult">*</button><button class="bnt" id="equal">=</button>
                </div>
                <div class="bntRow">
              <button class="bnt" id="zero">0</button><button class="bnt" id="one">1</button><button class="bnt" id="two">2</button><button class="bnt" id="three">3</button>
              <!-- comment -->
                </div>
                <div class="bntRow">
                    <button class="bnt" id="four">4</button><button class="bnt" id="five">5</button><button class="bnt" id="six">6</button><button class="bnt" id="seven">7</button>
                </div>
                <div class="bntRow">
                    <button class="bnt" id="eight">8</button><button class="bnt" id="nine">9</button><button class="bnt" id="cle">cle</button><button class="bnt" id="det">det</button>
                </div>
            </div>
                
            </div>
        </div>
   
      <script src="New work/new.js  ">
    </script>   
</body>
</html>
